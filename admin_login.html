{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7 col-lg-5">
  <div class="card shadow-sm border-0 border-top border-4 border-warning"><div class="card-body p-4">
    <h1 class="h3 fw-bold mb-1">Admin login</h1>
    <p class="text-muted">For college administrators only.</p>
    <form method="post" class="needs-validation" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label" for="email">Admin email</label>
        <input class="form-control" type="email" id="email" name="email" value="{{ email }}" required autofocus>
        <div class="invalid-feedback">Enter a valid email address.</div></div>
      <div class="mb-3"><label class="form-label" for="password">Password</label>
        <input class="form-control" type="password" id="password" name="password" required>
        <div class="invalid-feedback">Enter your password.</div></div>
      <button class="btn btn-dark w-100" type="submit">Login as admin</button>
    </form>
    <hr><p class="mb-0 small">Student? <a href="{{ url_for('auth.login') }}">Student login</a></p>
  </div></div>
</div></div>
{% endblock %}
