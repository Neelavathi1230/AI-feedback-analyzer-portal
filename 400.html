{% extends "base.html" %}
{% block title %}400{% endblock %}
{% block content %}
<div class="text-center py-5">
  <div class="display-1 fw-bold error-code">400</div>
  <h1 class="h3 fw-bold">Request could not be verified</h1>
  <p class="text-muted">Your form session expired or the request was invalid. Go back, refresh the page and try again.</p>
  <a class="btn btn-primary" href="{{ url_for('auth.index') }}">Back to home</a>
</div>
{% endblock %}
